[package]
name = "sley-test-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sley 2 native test host supervisor: root daemon config, closed run protocol, transient-unit rendering, enforcement math, worker entry and readiness probes."

[dependencies]
ed25519-dalek = "=3.0.0"
nix = { version = "=0.31.3", default-features = false, features = ["socket", "fs", "poll", "user"] }
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
zeroize = "=1.9.0"
sley-id = { path = "../sley-id" }
sley-mutate = { path = "../sley-mutate" }
sley-scb1 = { path = "../sley-scb1" }
sley-state-root = { path = "../sley-state-root" }
sley-tests = { path = "../sley-tests" }
sley-vm = { path = "../sley-vm" }

[dev-dependencies]
sley-schema = { path = "../sley-schema" }
sley-ssmc = { path = "../sley-ssmc" }

[lints]
workspace = true
