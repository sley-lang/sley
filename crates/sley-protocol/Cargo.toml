[package]
name = "sley-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sley 2 machine protocol (SMP1) frames, negotiation, and identity scoping."

[dependencies]
blake3 = "=1.8.2"
sley-id = { path = "../sley-id" }
sley-mutate = { path = "../sley-mutate" }
sley-policy = { path = "../sley-policy" }
sley-query = { path = "../sley-query" }
sley-repo = { path = "../sley-repo" }
sley-check = { path = "../sley-check" }
sley-conformance = { path = "../sley-conformance" }
sley-scb1 = { path = "../sley-scb1" }
sley-schema = { path = "../sley-schema" }
sley-state-root = { path = "../sley-state-root" }
sley-store = { path = "../sley-store" }
sley-tests = { path = "../sley-tests" }
sley-txn = { path = "../sley-txn" }
sley-vm = { path = "../sley-vm" }

[dev-dependencies]
serde_json = "=1.0.145"
sley-repo = { path = "../sley-repo", features = ["test-support"] }
sley-ssmc = { path = "../sley-ssmc" }

[lints]
workspace = true
