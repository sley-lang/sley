[package]
name = "sley-repo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sley 2 canonical repository packs and clean reconstruction."

[dependencies]
blake3 = "=1.8.2"
libc = "=0.2.189"
sley-id = { path = "../sley-id" }
sley-mutate = { path = "../sley-mutate" }
sley-scb1 = { path = "../sley-scb1" }
sley-schema = { path = "../sley-schema" }
sley-state-root = { path = "../sley-state-root" }
sley-policy = { path = "../sley-policy" }
sley-query = { path = "../sley-query" }
sley-ssmc = { path = "../sley-ssmc" }
sley-store = { path = "../sley-store" }
sley-tests = { path = "../sley-tests" }
sley-txn = { path = "../sley-txn" }

[features]
test-support = []

[dev-dependencies]
serde_json = "=1.0.145"
sley-check = { path = "../sley-check" }
sley-txn = { path = "../sley-txn", features = ["s20-530-test-hooks"] }
sley-vm = { path = "../sley-vm" }

[lints]
workspace = true
